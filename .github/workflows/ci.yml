name: CI - Pruebas Automáticas

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Backend
  # ──────────────────────────────────────────────
  test-backend:
    name: Backend - Lint y Cobertura
    runs-on: ubuntu-latest

    env:
      BASIC_USER: ${{ secrets.BASIC_USER }}
      BASIC_PASS: ${{ secrets.BASIC_PASS }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Instalar dependencias Backend
        working-directory: ./Backend
        run: npm install

      - name: Ejecutar ESLint Backend
        working-directory: ./Backend
        run: npm run lint

      - name: Ejecutar pruebas con cobertura Backend
        working-directory: ./Backend
        run: npm run test:coverage

      - name: Subir reporte de cobertura Backend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: Backend/coverage/
          retention-days: 30

  # ──────────────────────────────────────────────
  # JOB 2: Frontend (se ejecuta tras el Backend)
  # ──────────────────────────────────────────────
  test-frontend:
    name: Frontend - Lint y Cobertura
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Instalar dependencias Frontend
        working-directory: ./Frontend
        run: npm install

      - name: Ejecutar ESLint Frontend
        working-directory: ./Frontend
        run: npm run lint

      - name: Ejecutar pruebas con cobertura Frontend
        working-directory: ./Frontend
        run: npm run test:coverage

      - name: Subir reporte de cobertura Frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: Frontend/coverage/
          retention-days: 30
