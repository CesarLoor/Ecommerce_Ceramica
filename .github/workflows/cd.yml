name: CD - Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    env:
      BASIC_USER: ${{ secrets.BASIC_USER }}
      BASIC_PASS: ${{ secrets.BASIC_PASS }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # ─────────────────────────────────────────────────────
      # BACKEND: Install, Test, Build
      # ─────────────────────────────────────────────────────
      - name: Backend - Install dependencies
        working-directory: ./Backend
        run: npm install

      - name: Backend - Run tests
        working-directory: ./Backend
        run: npm run test:coverage

      - name: Backend - Build
        working-directory: ./Backend
        run: npm run build || echo "No build script found"

      # ─────────────────────────────────────────────────────
      # FRONTEND: Install, Test, Build
      # ─────────────────────────────────────────────────────
      - name: Frontend - Install dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Frontend - Run tests
        working-directory: ./Frontend
        run: npm run test:coverage

      - name: Frontend - Build
        working-directory: ./Frontend
        run: npm run build

      # ─────────────────────────────────────────────────────
      # DEPLOY TO RENDER (via Deploy Hooks)
      # ─────────────────────────────────────────────────────
      - name: Deploy Backend to Render
        if: success()
        run: |
          echo " Triggering Backend Deploy..."
          curl -X POST "${{ secrets.RENDER_BACKEND_HOOK }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            --retry 3 \
            --retry-delay 10 || echo "Backend deploy triggered"

      - name: Wait for Backend Deploy
        run: sleep 30

      - name: Deploy Frontend to Render
        if: success()
        run: |
          echo "🎨 Triggering Frontend Deploy..."
          curl -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            --retry 3 \
            --retry-delay 10 || echo "Frontend deploy triggered"

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Backend: https://barroco-api.onrender.com"
          echo "Frontend: https://barroco-app-dwrs.onrender.com"

      - name: Fetch Quality Score Report
        if: success()
        run: |
          echo "📊Consultando el Quality Scoring Engine..."
          
          # Consultar el endpoint usando BasicAuth y guardar la salida en quality-report.json
          curl -s -u "${{ env.BASIC_USER }}:${{ env.BASIC_PASS }}" \
            https://barroco-api.onrender.com/api/quality/score \
            -o quality-report.json
            
          echo "✅ Reporte descargado. Resumen en consola:"
          
          # Usar Node.js para parsear el JSON, imprimir un resumen y formatearlo con indentación (pretty-print)
          node -e "
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('quality-report.json', 'utf8'));
              console.log('--------------------------------------------------');
              console.log(report.message || 'Sin mensaje principal');
              if (report.data) console.log('Score General: ' + report.data.overallScore + '/100');
              console.log('--------------------------------------------------');
              fs.writeFileSync('quality-report.json', JSON.stringify(report, null, 2));
            } catch (err) {
              console.error('Error al procesar el reporte JSON:', err.message);
            }
          "

      - name: Upload Quality Report Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quality-score-report
          path: quality-report.json
          retention-days: 30

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs for details."
          exit 1